# 挂在 /etc/nginx/conf.d/default.conf（覆盖镜像自带的那份），主配置 nginx.conf 保持不变。
server {
    listen 80;
    server_name _;

    # 默认只有 1m，而 /files 的上限是 8MB（core/config.py 的 MAX_UPLOAD_BYTES）。
    # 不改这里，手机原图直接 413，且报错发生在 nginx 层，FastAPI 日志里一片空白，
    # 容易误判成"前端没传上来"。
    client_max_body_size 10m;

    location / {
        proxy_pass http://app:8000;

        # SSE 必须用 HTTP/1.1 并清空 Connection 头，否则默认 1.0 + close，长连接被掐
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /chat/stream 走 SSE。默认 buffering on 会把整段回答攒完再一次性吐出，
        # 前端表现是"转圈很久 → 答案整段蹦出来"，流式白做。
        # 这项不关不会报错，只会悄悄退化 —— 验证只能用 `curl -N` 看是不是逐段到达。
        proxy_buffering off;
        proxy_cache off;

        # 一次诊断要串 VL 描述 + 混合检索 + 多轮 LLM，默认 60s 容易 504
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
