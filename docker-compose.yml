# 项目名固定为 knowledge, 不要随手改。
# 原因: 本文件与 E:\IdeaProjects\springboot\Knowledge\docker-compose.yml 是同一套服务的
# 两份副本, 共用容器名 milvus-etcd / milvus-minio / milvus-standalone; 而 Docker 的卷名是
# <项目名>_<卷名> —— 项目名一旦不同, 在另一处 up -d 就会挂上一套**全新的空卷**,
# 现象就是"collection 全没了"。
# 现有数据在 knowledge_etcd_data / knowledge_minio_data / knowledge_milvus_data 里,
# 要改名必须先按 crawler/dump_agri.py 备份、再迁移卷。
name: knowledge

services:

  redis:
    # 按摘要固定 = Redis 8.8.0（等价于 redis:latest 当前指向的镜像）
    # 本机已有该镜像，无需联网拉取；若网络可用也可直接换成 redis:7.4-alpine
    image: redis@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
    container_name: agri-redis
    # appendonly 开启 AOF 持久化，避免容器重启后多轮对话记忆丢失
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 宿主机 6379 已被占用（现有容器 myredis），故对外映射到 6380
      # 对应 .env: REDIS_URL=redis://localhost:6380/0
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data              
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    # 2026-09-15 升级: v2.4.13 -> v2.4.24 (2.4 线最后补丁)
    # 动因: v2.4.13 的 rootcoord 元数据"快照层"每个库只保留一个集合,
    #       导致每次重启只有最后建的那个集合能恢复, 其余集合"消失"(数据仍在 MinIO)。
    image: milvusdb/milvus:v2.4.24
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus           
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

volumes:                                    
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
